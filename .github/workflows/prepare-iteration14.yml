name: Prepare iteration 14 branch

on:
  push:
    branches: ['feat/iteration-14-workspace-cv']

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/iteration-14-workspace-cv
      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Refresh lockfile and install
        run: pnpm install --no-frozen-lockfile
      - name: Format branch
        run: pnpm format
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .
          git commit -m "chore: refresh iteration 14 generated state"
          git push
