name: Generate landing pnpm lock

on:
  push:
    branches: ['fix/landing-pnpm-lockfile']

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate landing lockfile
        working-directory: landing
        run: pnpm install --lockfile-only

      - name: Verify exact MyPaas builder path
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/landing:/app" \
            -w /app \
            node:22-alpine \
            sh -c 'corepack enable && pnpm install --frozen-lockfile && pnpm run build'
          test -f landing/dist/index.html

      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add landing/pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: add standalone landing pnpm lockfile"
          git push
