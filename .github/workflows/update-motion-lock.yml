name: Update Motion lockfile

on:
  push:
    branches: ['refactor/mypaas-design-system']
    paths: ['package.json']

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/mypaas-design-system
      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update motion lockfile"
          git push origin HEAD:refactor/mypaas-design-system
