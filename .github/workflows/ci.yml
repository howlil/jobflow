name: CI

on:
  push:
    branches: ['master', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Verify compatibility evidence
        run: pnpm verify:compatibility
      - name: Build
        run: pnpm build
      - name: Verify generated extension
        run: pnpm verify:manifest
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser extension smoke test
        run: pnpm test:e2e
      - name: Package extension
        run: pnpm zip
