name: CI

on:
  pull_request:
    branches: ['master']
  push:
    branches: ['master']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format probe
        run: |
          pnpm exec prettier --write \
            entrypoints/content.tsx \
            src/application/forms/analyze-field-contexts.ts \
            src/application/prepare-fill/prepare-fill-plan.ts \
            src/components/floating/FloatingPanel.test.tsx \
            src/components/floating/FloatingPanel.tsx \
            src/domain/forms/field-context.ts \
            src/domain/forms/fingerprints.ts \
            src/infrastructure/dom/complex-application.test.ts \
            src/infrastructure/dom/extract-field-contexts.ts \
            src/infrastructure/dom/fill-controls.ts \
            src/infrastructure/dom/observe-form-mutations.ts \
            src/infrastructure/dom/structured-record-sections.ts
          git diff -- entrypoints src/application src/components src/domain src/infrastructure
          exit 1
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Verify generated extension
        run: pnpm verify:manifest