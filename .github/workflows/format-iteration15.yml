name: Format Iteration 15

on:
  push:
    paths:
      - .github/workflows/format-iteration15.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/ui/profile/profile-compact.css
      - name: Commit formatted file
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/profile/profile-compact.css
          git commit -m "style: apply repository formatter"
          git push origin HEAD:${GITHUB_REF_NAME}
