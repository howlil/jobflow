name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Verify compatibility evidence
        run: pnpm verify:compatibility
      - name: Build
        run: pnpm build
      - name: Verify generated extension
        run: pnpm verify:manifest
      - name: Package extension
        run: pnpm zip
      - name: Create checksum
        shell: bash
        run: sha256sum .output/jobflow-*-chrome.zip > SHA256SUMS
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package=$(find .output -maxdepth 1 -name 'jobflow-*-chrome.zip' -print -quit)
          test -n "$package"
          gh release create "$GITHUB_REF_NAME" "$package" SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Job Flow $GITHUB_REF_NAME"
